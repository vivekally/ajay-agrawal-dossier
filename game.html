<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threshold</title>
<meta name="description" content="A 25-minute game on the ideas in Prediction Machines. You run a lending desk: prediction gets cheaper every round, and what is scarce turns out to be your judgment.">
<meta property="og:title" content="Threshold">
<meta property="og:description" content="A 25-minute game on the ideas in Prediction Machines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="game.css?v=1">
<script>
/* Runs before first paint so a stored dark choice never flashes light.
   Twin of the snippet in index.html: keep the two identical. */
(function(){try{var t=localStorage.getItem("aa-theme");
if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
</head>
<body class="game">

<header class="gamebar">
  <div class="wrap gamebar-in">
    <a class="gamebar-name" href="index.html#pm">Threshold</a>
    <p class="gamebar-where"><span id="bar-round"></span><span id="bar-step"></span></p>
    <div class="themectl" role="group" aria-label="Colour theme">
      <button type="button" data-theme-set="system" aria-pressed="true" title="Follow the system setting">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg><span class="tlab">Auto</span>
      </button>
      <button type="button" data-theme-set="light" aria-pressed="false" title="Always light">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/></svg><span class="tlab">Light</span>
      </button>
      <button type="button" data-theme-set="dark" aria-pressed="false" title="Always dark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.8 6.8 0 0 0 11 11z"/></svg><span class="tlab">Dark</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap" id="screen" tabindex="-1"></main>

<noscript>
  <div class="wrap"><p class="viz-note">This game needs JavaScript. The written version of these
  ideas is on the <a href="index.html#pm">Prediction Machines tab</a> of the dossier.</p></div>
</noscript>

<script src="theme.js?v=1"></script>
<script type="module" src="game.js?v=1"></script>
</body>
</html>
