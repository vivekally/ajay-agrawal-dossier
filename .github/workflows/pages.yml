# Deploys the dossier to GitHub Pages, but only if the game's lesson tests pass.
#
# The site is static and has no build step. This workflow exists for one reason: engine.js and
# scenarios/lending.js encode the lessons of the book the game teaches, and those lessons are only
# true for particular numbers. Without a gate, a well-meaning tweak to a price or a base rate would
# deploy a game that teaches the opposite of the book, silently. The tests are the gate.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Lesson invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the lesson invariants (no dependencies to install)
        run: npm test

  deploy:
    name: Deploy to Pages
    needs: test                     # a failing lesson never reaches the site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
